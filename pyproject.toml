[tool.poetry]
name = "gcolab_pkg"
version = "1.0"
description = "A package for Google Colab functionalities."
authors = ["Andre <andre.kamarudin@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"
google-cloud-bigquery = ">=3.0.0,<4.0.0"
pandas = ">=2.0.0,<3.0.0"
requests = ">=2.32.3"
colorama = ">=0.0.0,<1.0.0"
pytz = "*"
numpy = "*"
pyyaml = "*"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

